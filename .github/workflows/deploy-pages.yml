name: Deploy website to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Determine deployment base path
              shell: bash
              run: |
                  repository_name="${GITHUB_REPOSITORY#*/}"
                  if [[ "$repository_name" == *.github.io ]]; then
                    echo "PAGES_BASE_PATH=/" >> "$GITHUB_ENV"
                  else
                    echo "PAGES_BASE_PATH=/$repository_name/" >> "$GITHUB_ENV"
                  fi

            - name: Build website
              run: |
                  npx tsc
                  npx vite build --mode github-pages --base="$PAGES_BASE_PATH"

            - name: Add client-side routing fallback
              run: |
                  cp dist-pages/index.html dist-pages/404.html
                  touch dist-pages/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist-pages

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
